name: iOS UI tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-tests:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun simctl list devices available -j > "$RUNNER_TEMP/simulators.json"
          SIMULATOR_UDID=$(python3 - "$RUNNER_TEMP/simulators.json" <<'PY'
          import json
          import re
          import sys

          with open(sys.argv[1]) as f:
              runtimes = json.load(f)['devices']
          candidates = [(runtime, device) for runtime, devices in runtimes.items()
                        if runtime.startswith('com.apple.CoreSimulator.SimRuntime.iOS-')
                        for device in devices
                        if device.get('isAvailable') and device['name'].startswith('iPhone')]
          if not candidates:
              sys.exit('No available iPhone simulator found')
          def runtime_version(candidate):
              runtime_id, _ = candidate
              suffix = runtime_id.split('iOS-', 1)[1]
              match = re.match(r'^(\d+(?:-\d+)*)', suffix)
              return tuple(map(int, match.group(1).split('-'))) if match else ()

          runtime, device = max(candidates, key=runtime_version)
          print(f"Selected {device['name']} ({runtime}): {device['udid']}", file=sys.stderr)
          print(device['udid'])
          PY
          )
          echo "udid=$SIMULATOR_UDID" >> "$GITHUB_OUTPUT"
          if ! xcrun simctl list devices booted | grep -Fq "$SIMULATOR_UDID"; then
            xcrun simctl boot "$SIMULATOR_UDID"
          fi
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      - name: Disable simulator password AutoFill
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          xcrun simctl spawn "$SIMULATOR_UDID" defaults write com.apple.WebUI AutoFillPasswords -bool false
          xcrun simctl spawn "$SIMULATOR_UDID" defaults read com.apple.WebUI AutoFillPasswords

      - name: Download and install WDIO demo app
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o "$RUNNER_TEMP/wdio.zip" \
            https://github.com/webdriverio/native-demo-app/releases/download/v2.2.0/ios.simulator.wdio.native.app.v2.2.0.zip
          echo '84c7efda441f7a8ed37bb1527bae357de8a44a16f878996d52bdfd9d58a8c66a  '"$RUNNER_TEMP/wdio.zip" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/wdio-app"
          ditto -x -k "$RUNNER_TEMP/wdio.zip" "$RUNNER_TEMP/wdio-app"
          APP_PATH=$(find "$RUNNER_TEMP/wdio-app" -type d -name '*.app' -prune -print -quit)
          test -n "$APP_PATH" || { echo 'No .app bundle found in release archive' >&2; exit 1; }
          xcrun simctl install "$SIMULATOR_UDID" "$APP_PATH"
          xcrun simctl get_app_container "$SIMULATOR_UDID" org.wdiodemoapp app

      - name: Run signup test
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          mkdir -p build/test-results
          xcodebuild test -project WDIODemoAutomation.xcodeproj -scheme WDIODemoAutomation \
            -testPlan All -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -parallel-testing-enabled NO \
            -only-testing:WDIODemoAutomationUITests/SignupTests/testSuccessfulSignup \
            -resultBundlePath build/test-results/ci.xcresult

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-test-results
          path: build/test-results/*.xcresult
          if-no-files-found: warn
          retention-days: 14
